<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日報メール文面ジェネレーター</title>
<style>
  :root {
    --bg-a: #fff4e6;
    --bg-b: #ffe9f2;
    --card: #ffffff;
    --text: #33261a;
    --sub: #9a7b63;
    --accent: #ff6b45;
    --accent-hover: #ff5227;
    --accent2: #ffb703;
    --border: #ffe0cc;
    --good: #1aa06d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, var(--bg-a), var(--bg-b));
    color: var(--text);
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 24px;
    text-align: center;
    margin-bottom: 4px;
  }
  h1::before { content: "📝 "; }
  p.lead {
    text-align: center;
    color: var(--sub);
    font-size: 13px;
    margin-top: 0;
    margin-bottom: 24px;
  }
  .layout {
    max-width: 880px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 760px) {
    .layout {
      grid-template-columns: 1fr 1fr;
      align-items: start;
    }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(255, 107, 69, 0.08);
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 16px;
    color: var(--accent);
    font-weight: 700;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"],
  input[type="number"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--text);
    transition: border-color 0.15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 60px; }
  .hint {
    font-size: 12px;
    color: var(--sub);
    margin-top: 4px;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  #generateBtn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    box-shadow: 0 6px 16px rgba(255, 107, 69, 0.35);
  }
  #generateBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(255, 107, 69, 0.4);
  }
  #generateBtn:active {
    transform: translateY(0);
    box-shadow: 0 4px 8px rgba(255, 107, 69, 0.3);
  }
  #copyBtn {
    background: #fff;
    color: var(--accent);
    border: 2px solid var(--accent);
  }
  #copyBtn:hover {
    background: #fff2ec;
    transform: translateY(-1px);
  }
  #copyBtn:active { transform: translateY(0); }
  #output {
    white-space: pre-wrap;
    background: #fffaf5;
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 16px;
    font-size: 14px;
    line-height: 1.7;
    min-height: 220px;
  }
  #output.reveal {
    animation: fadeInUp 0.4s ease both;
    border-style: solid;
    border-color: var(--accent2);
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #copyStatus {
    text-align: center;
    font-size: 13px;
    color: var(--good);
    height: 18px;
    margin-top: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>

<h1>日報メール文面ジェネレーター</h1>
<p class="lead">項目を選ぶだけで、上司に送る日報メールの文面を自動で組み立てます</p>

<div class="layout">
  <div class="card">
    <h2>入力</h2>

    <label for="myName">あなたの名前</label>
    <input type="text" id="myName" placeholder="例: 山田 太郎">

    <label for="bossName">送り先（上司）の名前</label>
    <input type="text" id="bossName" placeholder="例: 佐藤 部長">

    <label for="reportDate">日付</label>
    <input type="date" id="reportDate">

    <label for="visitCount">本日の訪問・架電件数</label>
    <input type="number" id="visitCount" min="0" placeholder="例: 5">

    <label for="feeling">商談の手応え</label>
    <select id="feeling">
      <option value="順調">順調 - 良い反応が多かった</option>
      <option value="普通">普通 - まずまずだった</option>
      <option value="要フォロー">要フォロー - 反応が薄かった／課題がある</option>
    </select>

    <label for="tomorrowPlan">明日の予定（任意）</label>
    <textarea id="tomorrowPlan" placeholder="例: A社へ再訪問、見積書の送付"></textarea>

    <label for="notes">特記事項・一言メモ（任意）</label>
    <textarea id="notes" placeholder="例: B社の担当者が異動になるとのこと"></textarea>

    <button id="generateBtn">日報メールを作る</button>
  </div>

  <div class="card">
    <h2>プレビュー</h2>
    <div id="output">左のフォームに入力して「日報メールを作る」を押すと、ここに文面が表示されます。</div>
    <button id="copyBtn">コピーする</button>
    <div id="copyStatus"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  const STORAGE_KEY = "nippou-generator:lastNames";

  function loadSavedNames() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (saved.myName) $("myName").value = saved.myName;
      if (saved.bossName) $("bossName").value = saved.bossName;
    } catch (e) {
      // 保存データが壊れていても無視して続行する
    }
  }

  function saveNames() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      myName: $("myName").value.trim(),
      bossName: $("bossName").value.trim(),
    }));
  }

  function formatDate(dateStr) {
    if (!dateStr) return "";
    const d = new Date(dateStr + "T00:00:00");
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  }

  function buildEmailText() {
    const myName = $("myName").value.trim() || "（あなたの名前）";
    const bossName = $("bossName").value.trim();
    const dateText = formatDate($("reportDate").value) || "本日";
    const visitCount = $("visitCount").value.trim();
    const feeling = $("feeling").value;
    const tomorrowPlan = $("tomorrowPlan").value.trim();
    const notes = $("notes").value.trim();

    const greeting = bossName ? `${bossName}様` : "お疲れ様です。";

    const lines = [];
    lines.push(greeting);
    lines.push("");
    lines.push(`お疲れ様です。${myName}です。`);
    lines.push(`${dateText}の営業日報をご報告いたします。`);
    lines.push("");
    lines.push("【本日の実績】");
    lines.push(`・訪問／架電件数：${visitCount || "0"}件`);
    lines.push(`・商談の手応え：${feeling}`);
    lines.push("");
    lines.push("【明日の予定】");
    lines.push(tomorrowPlan ? tomorrowPlan : "特にありません。");
    lines.push("");
    lines.push("【特記事項】");
    lines.push(notes ? notes : "特にありません。");
    lines.push("");
    lines.push("以上、ご確認のほどよろしくお願いいたします。");
    lines.push("");
    lines.push(myName);

    return lines.join("\n");
  }

  $("generateBtn").addEventListener("click", () => {
    saveNames();
    const output = $("output");
    output.textContent = buildEmailText();
    output.classList.remove("reveal");
    void output.offsetWidth; // アニメーションを再生させるためのリフロー
    output.classList.add("reveal");
    $("copyStatus").textContent = "";
  });

  $("copyBtn").addEventListener("click", async () => {
    const text = $("output").textContent;
    if (!text || text.startsWith("左のフォーム")) {
      $("copyStatus").textContent = "先に「日報メールを作る」を押してください";
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      $("copyStatus").textContent = "コピーしました！";
    } catch (e) {
      $("copyStatus").textContent = "コピーに失敗しました。文章を選択して手動でコピーしてください。";
    }
  });

  // 初期表示: 今日の日付をセットし、前回入力した名前を復元する
  $("reportDate").valueAsDate = new Date();
  loadSavedNames();
</script>

</body>
</html>
